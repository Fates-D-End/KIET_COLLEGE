<html>
<head>
    <title>College Registration Form</title>
   <link rel="stylesheet" href="Ca1Style.css">
</head>
<body>
    <header>
    <h1><u>College Registration Form</u></h1>
    </header>
    <form>
        <main>
          <fieldset>
            <legend><b><i>Personal Information</i></b></legend>
            
            <label for="student name">Full Name : </label>
            <input type="text"
                      id=" student name"
                      name="student name"
                      placeholder="Enter your name">
                         
                      <br><br>

            <label for="student email">Email : </label>
            <input type="email"
                      id=" student email"
                      name="student email"
                      placeholder="abc@gmail.com">
                      
                      <br><br>

            <label for="student phone number">Phone Number : </label>
            <input type="number"
                      id=" student phone number"
                      name="student phone number"> 
                      
                      <br><br>

             <label for="student gender">Gender : </label>
            <input type="radio"
                      id=" student gender"
                      name="student gender"
                      value="male">Male  
            
            <input type="radio"
                      id=" student gender"
                      name="student gender"
                      value="female">Female

                      <br><br>

                      <article>
             <label for="address">Address : </label>  <br>
             <textarea id="address"
                       name="address"
                       rows="4"
                       columns="30">
             </textarea>    
                      </article>
             
                        <br><br>

             <label for="state">State : </label>
             <input type="text"
                     id="state"
                     name="state"
                     placeholder="Uttar Pradesh">

          </fieldset>
 
                       <br><br>

           <label for="course">Course : </label>            
           <select type="course"
                     id="course">
                    <option>B.TECH</option>
                    <option>B.PHARMA</option>
                    <option>M.B.B.S</option>
                    <option>B.S.C</option>
                    <option>M.TECH</option>
            </select>

                     <br><br>

           <label for="semester">Semester : </label>
            <input type="radio"
                      id="semester"
                      name="semester"
                      value="1">1st  
            <input type="radio"
                      id="semester"
                      name="semester"
                      value="2">2nd
            <input type="radio"
                      id="semester"
                      name="semester"
                      value="3">3rd  
            <input type="radio"
                      id="semester"
                      name="semester"
                      value="4">4th
            <input type="radio"
                      id="semester"
                      name="semester"
                      value="5">5th  
            <input type="radio"
                      id="semester"
                      name="semester"
                      value="6">6th
            <input type="radio"
                      id="semester"
                      name="semester"
                      value="7">7th
            <input type="radio"
                      id="semester"
                      name="semester"
                      value="8">8th                              

                       <br><br><br><br><br>

             <footer>          
                <input type="submit" style="background-color: bisque; padding: 10; color:brown" value="SUBMIT"><br><br>
                <input type="reset" style="background-color: bisque; padding: 10; color:brown" value="RESET">         
             </footer>

             </main>
    </form>
</body>
</html>














</html>
