<html>
    <head>
        <title>Student Registration Form</title>
        <link rel="stylesheet" href="Homework_Form.css">
    </head>
    <body>
           
              <h1><u>STUDENT REGISTRATION</u></h1>

            <form>
                <fieldset>
                    <legend><i><b>Personal Information</i></b></legend>
              <label for="student name">NAME:</label>
              <input type="text"
                      id="student name"
                      name="student name"
                      placeholder="Enter your name" >

                      <br>
                      <br>

               <label for="email">EMAIL:</label>       
               <input type="email"
                        id="email"
                        name="email">
                      
                        <br>
                        <br>

               <label for="age">AGE:</label>       
               <input type="number"
                        id="age"
                        name="age"> 
                        
                        <br>
                        <br>

               <label for="dob">D.O.B:</label>       
               <input type="date"
                        id="dob"
                        name="dob"> 
                        
                        <br>
                        <br>  
                        
               <label for="gender">GENDER:</label>       
               <input type="radio"
                        id="gender"
                        name="gender"
                        value="male">Male
                        
                        
               <input type="radio"
                        id="gender"
                        name="gender"
                        value="female">Female          
                        
                        <br>
                        <br>

                </fieldset>
                 
                      <hr><br><hr>
                        
               <label for="course">COURSE:</label>       
               <select   id="course"
                        name="course">
                        <option>B.Tech</option> 
                        <option>M.Tech</option>
                        <option>Majdoori</option>
                </select>                                                         
                        <br>
                        <br>
                        
               <label for="Dull">CHECKBOX:</label>       
               <input type="checkbox"
                        id="Dull"
                        name="Dull"> Option 1
               <input type="checkbox"
                        id="Dull"
                        name="Dull"> Option 2
               <input type="checkbox"
                        id="Dull"
                        name="Dull"> Option 3
               <input type="checkbox"
                        id="Dull"
                        name="Dull"> Option 4                 

                        <br>
                        <br>

               <label for="message">MESSAGE:</label>
                       <br>
               <textarea id="message" 
                       name="message"
                       rows="10"
                       cols="10">
               </textarea>  
                       
                       <br><br>
                
                       
               <input type="submit" value="SUBMIT"  >      


           </form>

           <br><br><br><br>

        




    </body>
</html>
